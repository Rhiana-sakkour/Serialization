syntax = "proto2";

// Negative control: same name as the receiver, but the TAG NUMBER changed (1 -> 7).
package distributed.lab.wrongtag;

option java_package = "com.distributed.lab.wrongtag";
option java_outer_classname = "CustomerProfileWrongTagProto";

message CustomerProfile {
    required string client_full_name = 7;
    optional string city = 2 [default = "Damascus"];
    repeated string purchased_items = 3;
    repeated int32 item_prices = 4;
    optional bool is_holiday_deal_eligible = 5 [default = false];
}
